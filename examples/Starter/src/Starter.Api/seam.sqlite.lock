record EquipmentView = Starter.Equipment
  Id: Guid
  Name: string
  Condition: ConditionView
  Bookings: BookingView[]
  Version: int
record BookingView = Starter.Booking
  Who: string
  From: DateTimeOffset
  Until: DateTimeOffset
union ConditionView = Starter.Condition
  Bookable kind "bookable"
  Withdrawn kind "withdrawn" with Reason: string, Since: DateTimeOffset
refusal Starter.Refusal
  WhoRequired
  ReasonRequired
  EndsBeforeItStarts
  NotAvailable
  AlreadyBooked
  AlreadyOutOfService
  AlreadyAvailable
class BookingData = Starter.Data.BookingData
