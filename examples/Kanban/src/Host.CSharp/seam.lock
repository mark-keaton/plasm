record BoardSummaryView = Kanban.Data.BoardSummary
  Slug: string
  Name: string
  WipLimit: int
  Backlog: int
  Doing: int
  Done: int
  Newest: string[]
record BoardView = Kanban.Data.BoardWithCards
  Slug: string
  Name: string
  WipLimit: int
  Cards: CardView[]
record CardView = Kanban.Card
  Id: Guid
  Title: string
  Stage: StageView
  Comments: CommentView[]
  Labels: TagView[]
  Version: int
record CommentView = Kanban.Comment
  Author: string
  Body: string
  At: DateTimeOffset
record TagView = Kanban.Tag
  Name: string
record NewBoard = Kanban.Data.NewBoard, and from C#
  Slug: string
  Name: string
  WipLimit: int
record NewCard = Kanban.Data.NewCard, and from C#
  Title: string
record Start = Kanban.Data.Start, and from C#
  Version: int
  Assignee: string
record Rename = Kanban.Data.Rename, and from C#
  Version: int
  Title: string
union StageView = Kanban.Stage
  Backlog kind "backlog"
  Doing kind "doing" with Assignee: string, Since: DateTimeOffset
  Done kind "done" with Resolution: ResolutionView, At: DateTimeOffset
union ResolutionView = Kanban.Resolution
  Shipped kind "shipped"
  Dropped kind "dropped" with Reason: string
