name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A release runs all of this first, at the tagged commit (release.yml).
  workflow_call:

permissions:
  contents: read

# The workflow's name is the caller's when a release runs this, so a release's
# check and a push's CI on the same ref do not cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Pre-release packages are versioned 0.1.0-alpha.<run number>.
  VERSION_SUFFIX: alpha.${{ github.run_number }}

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.fsproj', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Plasm.slnx

      - name: Build
        run: dotnet build Plasm.slnx -c Release --no-restore -p:VersionSuffix=${{ env.VERSION_SUFFIX }}

      # The acceptance scenarios and unit tests run against PostgreSQL 18,
      # started by Testcontainers on the runner's Docker.
      - name: Test
        run: dotnet test -c Release --no-build

      # The features listed for SQLite run again on the SQLite that
      # Microsoft.Data.Sqlite bundles, with no PostgreSQL. The script runs
      # dotnet test --no-build without a configuration, so it needs the
      # Debug build made here.
      - name: Test on SQLite
        run: |
          python3 tests/Plasm.Providers/check-tags.py
          dotnet build tests/Plasm.Specs
          bash tests/Plasm.Providers/sqlite-run.sh "$RUNNER_TEMP/sqlite-run"

      - name: Upload the SQLite run's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-run
          path: ${{ runner.temp }}/sqlite-run
          if-no-files-found: ignore

      # Plasm.slnx leaves Plasm.PGlite out, and only the koans' deployment
      # builds it: this compiles it alone, so a change to the provider
      # interfaces cannot break it unseen.
      - name: Compile Plasm.PGlite
        run: bash tests/Plasm.Providers/build-pglite.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**
          if-no-files-found: ignore

      - name: Pack
        run: dotnet pack Plasm.slnx -c Release --no-build -o artifacts -p:VersionSuffix=${{ env.VERSION_SUFFIX }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  # examples/Starter as a reader copies it: its packages come from nuget.org,
  # not from this repository's sources. Not run for a release, whose packages
  # are not published yet when its check runs; release.yml tests the Starter
  # from nuget.org itself once it has published.
  #
  # Before a release the Starter may pin the coming version, which no feed
  # has. Then, and only then, the repository is packed at that version and
  # the Starter takes Plasm from those files (.github/scripts/starter-pins.py
  # decides, and refuses a pin that is neither listed nor coming). The job's
  # summary says which of the two it did.
  starter:
    name: The Starter, from nuget.org
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: examples/Starter/global.json

      - name: Where the Starter's Plasm packages come from
        id: pins
        run: python3 .github/scripts/starter-pins.py ci

      - uses: actions/setup-dotnet@v4
        if: steps.pins.outputs.source == 'repository'
        with:
          global-json-file: global.json

      # The packages release.yml publishes, at the version the Starter pins.
      # Plasm's packages then come from these files alone, and every other
      # package from nuget.org as before.
      - name: Pack the repository at the pinned version
        if: steps.pins.outputs.source == 'repository'
        env:
          PINNED: ${{ steps.pins.outputs.version }}
        run: |
          packages=$(sed -n 's/^  PACKAGES: *//p' .github/workflows/release.yml)
          [ -n "$packages" ] || { echo "::error::release.yml names no PACKAGES."; exit 1; }
          feed="$RUNNER_TEMP/plasm-feed"
          for p in $packages; do
            echo "::group::$p"
            dotnet pack "src/$p" -c Release -o "$feed" -p:Version="$PINNED" -p:ProduceReferenceAssembly=false
            echo "::endgroup::"
          done
          cat > examples/Starter/nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="repository" value="$feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="repository">
                <package pattern="Plasm" />
                <package pattern="Plasm.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      # Its tests run against PostgreSQL in Docker, in a sandbox.
      - name: Test
        working-directory: examples/Starter
        run: dotnet test

      # The same tests with the Starter built for SQLite: a database file,
      # no server.
      - name: Test on SQLite
        working-directory: examples/Starter
        run: dotnet test --project tests/Starter.Tests -p:StarterDatabase=sqlite

  website-sql:
    name: Website SQL is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Re-runs every website example against PostgreSQL and fails if a
      # highlighted fragment is no longer in the generated SQL, or if the
      # committed website/sql.js differs from what the library now produces.
      - name: Regenerate website/sql.js
        run: dotnet run --project examples/Plasm.Examples -- sql

      # Timestamps in parameter values come from the clock, so they are
      # masked; everything else (SQL, parameters, row counts) must match.
      - name: Check for differences
        run: |
          mask() { sed -E 's#[0-9]{2}/[0-9]{2}/[0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2}#<timestamp>#g'; }
          git show HEAD:website/sql.js | mask > committed.js
          mask < website/sql.js > generated.js
          if ! diff -u committed.js generated.js; then
            echo "::error file=website/sql.js::website/sql.js is out of date; run: dotnet run --project examples/Plasm.Examples -- sql"
            exit 1
          fi
