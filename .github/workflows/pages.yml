name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # koans/browser/app/stage.sh reads the reference assemblies from ~/.dotnet.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: /home/runner/.dotnet

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: koans/browser/app/package-lock.json

      # The koans in the browser: the F# compiler and PGlite as static files.
      # Without the commit's hash in each assembly's informational version, an
      # assembly whose sources did not change keeps its bytes, and so its
      # fingerprinted name, from one deploy to the next; a koans page open
      # across a deploy then still finds the files it was told to load.
      - name: Build the browser koans
        env:
          IncludeSourceRevisionInInformationalVersion: false
        run: |
          npm ci --no-audit --no-fund --prefix koans/browser/app
          bash koans/browser/app/stage.sh "$RUNNER_TEMP/koans"

      # Renders docs/ and ROADMAP.md into _site/, and fails when a code block
      # that names its source file is no longer in that file.
      - name: Build
        run: dotnet fsi website/build.fsx --koans "$RUNNER_TEMP/koans"

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
