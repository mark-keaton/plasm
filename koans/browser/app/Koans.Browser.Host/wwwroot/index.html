<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plasm Koans</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 18rem 1fr; min-height: 100vh; }
  nav { border-right: 1px solid #ddd; padding: 1rem; overflow-y: auto; max-height: 100vh; }
  nav h2 { font-size: .9rem; margin: 1rem 0 .25rem; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: .15rem .25rem; cursor: pointer; font: inherit; }
  nav button.current { background: #eef; }
  nav button[data-state="passed"]::before { content: "✔ "; color: #1a7f37; }
  nav button[data-state="failed"]::before { content: "✘ "; color: #b42318; }
  main { padding: 1rem 2rem; min-width: 0; }
  textarea { width: 100%; min-height: 18rem; font: 13px/1.5 ui-monospace, monospace; }
  pre { background: #f4f4f4; padding: .75rem; white-space: pre-wrap; }
  #result[data-status="passed"] { color: #1a7f37; }
  #result[data-status]:not([data-status="passed"]) { color: #b42318; }
  @media (max-width: 40rem) { body { grid-template-columns: 1fr; } nav { max-height: 30vh; border-right: 0; border-bottom: 1px solid #ddd; } }
</style>
</head>
<body>
<nav id="lessons" aria-label="Lessons"></nav>
<main>
  <h1>Plasm Koans</h1>
  <p id="status">Loading…</p>
  <section id="koan" hidden>
    <h2 id="lesson"></h2>
    <p id="goal"></p>
    <h3 id="name"></h3>
    <textarea id="code" spellcheck="false" aria-label="Koan code"></textarea>
    <p>
      <button id="run">Run</button>
      <button id="stop" hidden>Stop</button>
      <button id="next" hidden>Next koan →</button>
    </p>
    <pre id="result"></pre>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
