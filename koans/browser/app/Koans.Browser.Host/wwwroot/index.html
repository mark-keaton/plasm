<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plasm Koans</title>
<style>
  /* Colours and type follow Plasm's website. Fonts come from this site (or
     the reader's machine), so the course works offline. JetBrains Mono (OFL,
     fonts/JetBrainsMono-OFL.txt) joins F# operators such as |> and ->. */
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  :root {
    --paper: #F6F5F0; --surface: #FFFFFF; --sunk: #F0EFE9;
    --ink: #16181D; --ink-2: #3A3D45; --ink-3: #4A4D55; --ink-4: #8A8D95;
    --line: #E2E0D8; --line-2: #C9C6BB;
    --accent: #5B5BD6; --accent-ink: #2B2B8A; --accent-soft: #E9E8FF; --on-accent: #FFFFFF;
    --ok: #0F766E; --ok-soft: #E6F4F1; --ok-ink: #0B5A53; --ok-line: #B9DDD6;
    --warn: #B45309; --warn-soft: #FCEFE3; --warn-ink: #8A3A0B; --warn-line: #F1D5BB;
    --tok-k: #7C3AED; --tok-t: #0F766E; --tok-s: #B45309; --tok-c: #6B6E76; --tok-n: #B91C1C; --tok-f: #1D4ED8;
    --display: "Space Grotesk", Inter, system-ui, sans-serif;
    --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121418; --surface: #1A1D22; --sunk: #20232A;
      --ink: #EDECE6; --ink-2: #C5C6CC; --ink-3: #A6A8B0; --ink-4: #7C7F88;
      --line: #2C3038; --line-2: #3A3F49;
      --accent: #8B8BF0; --accent-ink: #C9C9FF; --accent-soft: #272A4D; --on-accent: #121418;
      --ok: #3FBFAE; --ok-soft: #13302D; --ok-ink: #8FE0D3; --ok-line: #24514B;
      --warn: #E59A52; --warn-soft: #3A2414; --warn-ink: #F5C291; --warn-line: #5A3A20;
      --tok-k: #C4A5FF; --tok-t: #6FD6C6; --tok-s: #F2B775; --tok-c: #8C909A; --tok-n: #FF9C9C; --tok-f: #8CB4FF;
    }
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--body); min-height: 100vh; display: flex; flex-direction: column; }
  a { color: var(--accent-ink); }
  a:hover { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; color: inherit; }

  /* Header */
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 28px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 600 19px/1 var(--display); letter-spacing: -0.01em; }
  .brand:hover { color: var(--ink); }
  .overall { display: flex; align-items: center; gap: 12px; flex: 1 1 220px; max-width: 360px; }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
  #overall-bar { height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  #overall { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  #status { margin: 0; font-size: 13px; color: var(--ink-3); flex: 1 1 260px; }
  .links { margin-left: auto; display: flex; gap: 20px; font-size: 14px; }

  .layout { display: flex; flex-wrap: wrap; flex: 1; align-items: stretch; }

  /* Lessons */
  #lessons { flex: 1 1 280px; max-width: 330px; border-right: 1px solid var(--line); background: var(--surface); padding: 18px 12px; overflow-y: auto; max-height: calc(100vh - 57px); position: sticky; top: 0; }
  .nav-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 0 10px 8px; }
  .lesson { border-radius: 10px; margin: 2px 0; }
  .lesson.open { background: var(--paper); padding-bottom: 6px; }
  #lessons h2 { margin: 0; font-size: inherit; font-weight: inherit; }
  .lesson-toggle { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; min-height: 40px; color: var(--ink-2); }
  .lesson-toggle:hover { background: var(--paper); }
  .lesson-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lesson.open .lesson-toggle { color: var(--ink); font-weight: 600; }
  .lesson-toggle .title { flex: 1; }
  .ring { flex: none; width: 18px; height: 18px; border-radius: 50%;
    background: conic-gradient(var(--ok) calc(var(--p, 0) * 1%), var(--line-2) 0);
    -webkit-mask: radial-gradient(circle, transparent 5.5px, #000 6px); mask: radial-gradient(circle, transparent 5.5px, #000 6px); }
  .ring.done { -webkit-mask: none; mask: none; background: var(--ok); display: grid; place-items: center; }
  .ring.done::after { content: ""; width: 7px; height: 4px; border: solid var(--surface); border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  #lessons .progress { font-size: 13px; color: var(--ink-3); font-weight: 400; white-space: nowrap; }
  .koans { display: flex; flex-direction: column; padding-left: 20px; font-size: 14px; }
  .koans[hidden] { display: none; }
  .koans button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: baseline; gap: 10px; padding: 5px 10px; border-left: 2px solid var(--line); color: var(--ink-2); }
  .koans button:hover { color: var(--ink); }
  .koans button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .koans button::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line-2); transform: translateY(1px); }
  .koans button[data-state="passed"]::before { content: "✓"; border: 0; width: 9px; height: auto; border-radius: 0; color: var(--ok); font-weight: 700; transform: none; }
  .koans button[data-state="failed"]::before { content: "✗"; border: 0; width: 9px; height: auto; border-radius: 0; color: var(--warn); font-weight: 700; transform: none; }
  .koans button.current { border-left-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; border-radius: 0 6px 6px 0; }

  /* The koan */
  main { flex: 999 1 560px; min-width: 0; padding: 32px 40px 56px; }
  #koan { max-width: 980px; display: flex; flex-direction: column; gap: 20px; }
  #koan[hidden] { display: none; }
  .heading { display: flex; flex-direction: column; gap: 6px; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  #name { margin: 0; font: 600 32px/1.2 var(--display); letter-spacing: -0.015em; }
  #goal { margin: 4px 0 0; color: var(--ink-2); max-width: 68ch; }
  .teaches { margin: 6px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-3); }
  .teaches[hidden] { display: none; }
  #teaches { padding: 3px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok-ink); text-decoration: none; font: 12.5px/1.5 var(--mono); }
  #teaches:hover { text-decoration: underline; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); }
  .hint { font-size: 13px; color: var(--ink-3); }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn { font-size: 14px; padding: 0 14px; min-height: 36px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .btn:hover { background: var(--paper); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); color: var(--on-accent); }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .btn[hidden] { display: none; }
  .kbd { font-weight: 400; opacity: .8; font-size: 12px; }
  #next .kbd { margin-left: 10px; }
  .definition-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-right: 16px; }
  .kind { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
  .kind[data-kind="your app"] { background: var(--accent-soft); color: var(--accent-ink); }
  .kind[data-kind="Plasm"] { background: var(--ok-soft); color: var(--ok-ink); }
  #vim[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .vim-mode { font: 600 12px/1 var(--mono); letter-spacing: .06em; padding: 6px 8px; border-radius: 6px; background: var(--sunk); color: var(--ink-2); }
  .vim-mode[data-mode="insert"] { background: var(--accent-soft); color: var(--accent-ink); }

  /* The editor (CodeMirror): the page's font, colours and blanks. */
  .editor { font: 14px/1.7 var(--mono); font-variant-ligatures: contextual; }
  .editor .cm-editor { background: transparent; color: var(--ink); min-height: 8rem; }
  .editor .cm-editor.cm-focused { outline: none; }
  .editor .cm-scroller { font: inherit; line-height: 1.7; }
  .editor .cm-content { padding: 14px 0; caret-color: var(--ink); }
  .editor .cm-line { padding: 0 20px 0 4px; }
  .editor .cm-gutters { background: transparent; border: 0; color: var(--ink-4); }
  .editor .cm-lineNumbers .cm-gutterElement { padding: 0 12px 0 16px; }
  .editor .cm-activeLine { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  .editor .cm-cursor { border-left-color: var(--ink); }
  .editor .cm-fat-cursor { background: color-mix(in srgb, var(--accent) 55%, transparent) !important; }
  .editor .cm-selectionBackground, .editor .cm-focused .cm-selectionBackground { background: color-mix(in srgb, var(--accent) 30%, transparent) !important; }
  .cm-tooltip { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; font: 13px/1.5 var(--mono); }
  .cm-tooltip-autocomplete ul li[aria-selected] { background: var(--accent-soft); color: var(--accent-ink); }
  .cm-completionDetail { color: var(--ink-3); font-style: normal; margin-left: 1em; }
  .type-tip { max-width: 560px; padding: 8px 12px; }
  .type-tip .signature { margin: 0; white-space: pre-wrap; font: 13px/1.5 var(--mono); }
  .type-tip .doc { margin: 6px 0 0; font: 13px/1.5 var(--body, inherit); color: var(--ink-2); }
  .k { color: var(--tok-k); } .t { color: var(--tok-t); } .s { color: var(--tok-s); }
  .c { color: var(--tok-c); font-style: italic; } .n { color: var(--tok-n); } .f { color: var(--tok-f); }
  mark.blank { background: var(--warn-soft); color: var(--warn-ink); border-radius: 3px; box-shadow: 0 0 0 2px var(--warn-soft), inset 0 -2px 0 var(--warn); }

  /* The result */
  #result:empty { display: none; }
  #result { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
  #result[data-status="passed"] { border-color: var(--ok-line); }
  #result[data-status]:not([data-status="passed"]):not([data-status="stopped"]) { border-color: var(--warn-line); }
  .headline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 18px; font-weight: 600; background: var(--sunk); color: var(--ink-2); }
  [data-status="passed"] .headline { background: var(--ok-soft); color: var(--ok-ink); }
  [data-status="unanswered"] .headline, [data-status="failed"] .headline, [data-status="threw"] .headline, [data-status="compile"] .headline { background: var(--warn-soft); color: var(--warn-ink); }
  .badge { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; line-height: 1; background: currentColor; }
  .badge::after { color: var(--surface); }
  [data-status="passed"] .badge::after { content: "✓"; }
  [data-status="unanswered"] .badge::after, [data-status="failed"] .badge::after, [data-status="threw"] .badge::after, [data-status="compile"] .badge::after { content: "✗"; }
  .headline .btn { margin-left: auto; font-weight: 500; }
  .part { padding: 16px 18px 0; display: flex; flex-direction: column; gap: 6px; }
  .part:last-child { padding-bottom: 16px; }
  .compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .compare > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  #result pre { margin: 0; font: 13px/1.65 var(--mono); padding: 10px 14px; border-radius: 8px; background: var(--sunk); overflow-x: auto; white-space: pre; }
  .meditate { margin-top: 16px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--paper); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; color: var(--ink-2); }
  .meditate strong { font-family: var(--display); color: var(--accent-ink); white-space: nowrap; }
  .meditate.hint { margin-top: 0; }
  #hint-box { margin-top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  #hint-box[hidden], #hint-text[hidden] { display: none; }
  #hint-box .btn { min-height: 32px; font-size: 13px; color: var(--accent-ink); }
  #hint-text { align-self: stretch; border: 1px solid var(--line); border-radius: 8px; }

  /* Given, then the koan: the data and definitions a koan starts from, above its code. */
  .step { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 16px; }
  .step-label { margin: 6px 0 0; font: 600 18px/1.4 var(--display); color: var(--accent-ink); }
  #koan:not(.has-given) .step { display: block; }
  #koan:not(.has-given) .step-label { display: none; }
  .step-body { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  #koan #given[hidden] { display: none; }
  .given-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .given-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .given-head .what { font-weight: 600; }
  .given-head .note { font-size: 13px; color: var(--ink-3); }
  .given-head .btn { margin-left: auto; min-height: 32px; font-size: 13px; color: var(--accent-ink); }
  .table[hidden] { display: none; }
  .table + .table { border-top: 1px solid var(--line); }
  .table-name { padding: 8px 16px 0; font: 500 13px/1.6 var(--mono); }
  .table-scroll { overflow-x: auto; padding: 4px 16px 12px; }
  .table table { border-collapse: collapse; font: 13px/1.6 var(--mono); }
  .table th { text-align: left; font-weight: 500; padding: 5px 14px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .table th small { font: 400 11.5px var(--body); color: var(--ink-3); margin-left: 6px; }
  .table td { padding: 4px 14px 4px 0; border-bottom: 1px solid var(--sunk); white-space: nowrap; }
  .table td.null span { font-size: 11.5px; letter-spacing: .04em; color: var(--ink-3); background: var(--sunk); border: 1px dashed var(--line-2); border-radius: 4px; padding: 0 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 12.5px/1 var(--mono); padding: 0 10px; min-height: 30px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
  .definition[hidden] { display: none; }
  .definition .source { display: block; padding: 8px 16px 0; font-size: 12.5px; color: var(--ink-3); }
  .definition pre { margin: 0; padding: 8px 16px 12px; font: 13px/1.65 var(--mono); white-space: pre; overflow-x: auto; }
  .definition pre .name { cursor: help; border-radius: 3px; }
  .definition pre .name:hover, .definition pre .name.current { background: var(--accent-soft); }
  .definition pre:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .given-tip { position: fixed; z-index: 30; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); }
  .given-tip[hidden] { display: none; }
  .definition .marked { display: inline-block; min-width: 100%; background: var(--accent-soft); border-radius: 3px; }

  @media (max-width: 720px) {
    .step { grid-template-columns: minmax(0, 1fr); }
    .top { padding: 12px 16px; }
    #lessons { max-width: none; max-height: 40vh; position: static; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 24px 16px 40px; }
    .compare { grid-template-columns: minmax(0, 1fr); }
    #name { font-size: 26px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="currentColor" stroke-width="2.5" style="color: var(--accent)"></circle><circle cx="13" cy="13" r="4" style="fill: var(--accent)"></circle></svg>
    Plasm Koans
  </a>
  <div class="overall">
    <div class="bar" aria-hidden="true"><div id="overall-bar"></div></div>
    <span id="overall"></span>
  </div>
  <p id="status" role="status">Loading…</p>
  <nav class="links" aria-label="Elsewhere"><a href="terminal.html">Terminal version</a></nav>
</header>
<div class="layout">
  <nav id="lessons" aria-label="Lessons"><div class="nav-label">Lessons</div></nav>
  <main>
    <section id="koan" hidden>
      <div class="heading">
        <div class="eyebrow" id="lesson"></div>
        <h1 id="name"></h1>
        <p id="goal"></p>
        <p class="teaches">Teaches <a id="teaches" target="_blank" rel="noopener"></a></p>
      </div>
      <div class="step" id="given" hidden data-state="loading">
        <h2 class="step-label">Given</h2>
        <div class="step-body">
          <section class="given-card" aria-label="Tables">
            <div class="given-head">
              <span class="what">The data it starts from</span>
              <span class="note">the same for every koan; changes are rolled back</span>
              <button class="btn" id="all-tables" aria-pressed="false">All tables</button>
            </div>
            <div id="given-tables"></div>
          </section>
          <section class="given-card" id="given-definitions-card" aria-label="Definitions">
            <div class="given-head">
              <span class="what">and these definitions</span>
              <div class="chips" id="given-chips"></div>
            </div>
            <div id="given-definitions"></div>
          </section>
        </div>
      </div>
      <div class="step">
        <h2 class="step-label">Then</h2>
        <div class="step-body">
      <section class="card" aria-label="Koan code">
        <div class="toolbar">
          <span class="hint">Fill in each <mark class="blank">__</mark> so the koan holds.</span>
          <div class="actions">
            <span id="vim-mode" class="vim-mode" data-mode="normal" hidden>NORMAL</span>
            <button class="btn" id="vim" aria-pressed="false" title="Vim keys in the editor">Vim</button>
            <button class="btn" id="reset">Reset</button>
            <button class="btn" id="stop" hidden>Stop</button>
            <button class="btn primary" id="run">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.8v8.4L10 6z" fill="currentColor"></path></svg>
              Run <span class="kbd" id="shortcut"></span>
            </button>
          </div>
        </div>
        <div class="editor" id="code"></div>
      </section>
      <section id="hint-box" hidden>
        <button class="btn" id="hint-toggle" type="button" aria-expanded="false" aria-controls="hint-text">Show a hint</button>
        <div id="hint-text" class="meditate hint" hidden><strong>A hint</strong><span></span></div>
      </section>
      <section id="result" aria-live="polite" aria-label="Result"></section>
        </div>
      </div>
    </section>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
